# Archive-update workflow for the presentation tiles.
#
# THIS REPO HAD NO WORKFLOW AT ALL until now, which mattered in exactly one
# place: usdm.R. The county tilesets are built from frozen vintages that change
# at most once a year, but the USDM gains a week every Thursday, so
# data-tiles/usdm/ went stale seven days after every manual run with nothing to
# say so.
#
# The scheduled path runs usdm.R and census.R. Both discover their inputs from
# the upstream manifest and skip anything the bucket already holds, so a quiet
# week costs two list calls and publishes nothing — census.R only does work in
# the year Census posts a new vintage, and it now notices that on its own.
#
# counties.R and fsa-lfp-counties.R are NOT scheduled. They still rebuild
# unconditionally, and their sources are frozen archives that change only when
# someone re-runs a FOIA or a boundary release; reach them with the `scripts`
# input.
#
# TWO FAMILIES, ONE NESTED LOOP. Every script takes SPACE=dummy|geo and builds
# exactly one space per invocation, so the update step iterates SCRIPTS x SPACES.
# SPACES defaults to `dummy geo`: both families are published and discover
# their own work, so a quiet Thursday costs four list calls instead of two.
# It landed as `dummy` alone until the geographic family's 1,391 USDM weeks
# were backfilled by hand (2026-09-01) — building the lot on a runner would
# not have fit the 350-minute timeout.
name: update
run-name: Update the data-tiles archive → S3

on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Run even when the freshness precheck sees nothing new upstream.
        type: boolean
        default: false
      scripts:
        description: >-
          Space-separated build scripts. Defaults to the weekly pair; use
          "counties.R" or "fsa-lfp-counties.R" to rebuild a frozen tileset.
        type: string
        default: usdm.R census.R
      spaces:
        description: >-
          Space-separated coordinate spaces. "dummy" is the published
          sfsa-albers-usa/1 family, "geo" its true-EPSG:4326 sibling; every
          script named above runs once per space.
        type: string
        default: dummy geo
  schedule:
    # Thursdays, 21:00 UTC — behind the whole USDM cascade. usdm publishes at
    # 13:00 (14:45 in winter) and usdm-counties at 20:20, so by 21:00 the week
    # this repo needs is on the CDN. usdm dispatches its first tier directly;
    # this is a cron because data-tiles is not in that fan-out.
    - cron: '0 21 * * 4'
  push:
    branches: [main]
    paths: ['**.R', '.github/workflows/**']

permissions:
  id-token: write
  contents: read

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Cheap gate, mirroring usdm-counties'. Anything ambiguous resolves to
  # proceed=true, so a network blip costs a redundant run — which usdm.R's own
  # incremental skip turns into one S3 list call — rather than silently stalling
  # the archive. Ubuntu, not macOS: this needs GNU `date -d`.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          UPSTREAM: https://data.sustainable-fsa.com/usdm/data/parquet
          MINE: https://data.sustainable-fsa.com/data-tiles/usdm
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # ONLY THE CRON IS GATED. A push changed the code and a dispatch is
          # somebody asking, so both go straight through; the gate exists to
          # save runner minutes on a Thursday when the USDM has not moved.
          # Earlier this also inspected the script list, to avoid skipping a
          # census-only run on a quiet USDM week — unnecessary now that both
          # scripts skip on their own, and one less string to keep in step with
          # the input default.
          if [ "$EVENT" != schedule ] || [ "${FORCE:-false}" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest USDM Tuesday at least two days old — mirrors usdm_get_dates().
          wk=
          for i in $(seq 2 15); do
            d=$(date -u -d "$i days ago" +%F)
            if [ "$(date -u -d "$d" +%u)" = 2 ]; then wk="$d"; break; fi
          done

          # `--retry` writes %{http_code} once per attempt, so keep the last one.
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 \
              -I "$1" 2>/dev/null | tail -c 3
          }

          up=$(probe "$UPSTREAM/USDM_$wk.parquet")
          mine=$(probe "$MINE/USDM_$wk.topojson")
          echo "week=$wk upstream=$up mine=$mine"

          lvl=notice
          if [ "$EVENT" = workflow_dispatch ]; then lvl=warning; fi

          if [ "$up" = 404 ]; then
            echo "::${lvl}::Upstream usdm parquet for $wk is not published yet; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$up" = 200 ] && [ "$mine" = 200 ]; then
            echo "::notice::$wk is already in this archive; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: data-tiles
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
      SCRIPTS: ${{ inputs.scripts || 'usdm.R census.R' }}
      SPACES: ${{ inputs.spaces || 'dummy geo' }}
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      # setup-geospatial ALREADY provides node, tippecanoe (2.79.0, conda-forge)
      # and mapshaper, so nothing else has to be installed — an earlier version
      # of this workflow added setup-node, an npm install and a brew install of
      # tippecanoe, all three redundant.
      #
      # The one thing worth overriding is the mapshaper VERSION. The shared
      # action installs it unpinned, and usdm.R's retention gate is calibrated
      # against a specific one: quantisation behaviour is exactly the kind of
      # thing that can shift under a minor release. Re-pinning costs ~5 seconds
      # and is what makes a CI build byte-identical to a local one — verified,
      # sha256 4a4b96c7 for 2026-08-18 built both ways.
      - name: Pin mapshaper to the calibrated version
        run: |
          npm install -g mapshaper@0.6.113
          mapshaper -v

      # THE CRAN sf BINARY REPRODUCES NOTHING IN THIS REPO BYTE-IDENTICALLY, so
      # what sf links against is not a detail of the runner. It bundles GDAL
      # 3.8.5 and PROJ 9.5.1 with no datum grids and no Parquet driver — and
      # every transform here crosses NAD83 <-> WGS84 (dummy-space hops through
      # ESRI:102003, census.R reads EPSG:4269). With no grid PROJ falls through
      # to the ballpark +proj=noop and lands 0.6-2.3 m off: no error, no
      # warning, tiles that look right and misregister against everything
      # already published.
      #
      # setup-geospatial does not install that binary. r-base, r-sf, gdal, geos
      # and proj all come from conda-forge, and libgdal-arrow-parquet supplies
      # the driver usdm.R reads each week's parquet through. But conda-forge
      # ships proj WITHOUT proj-data and its activation script sets
      # PROJ_NETWORK=ON in its place, so the grids arrive from cdn.proj.org per
      # run and are not in the action's env cache. THAT is what this gate is
      # for: a PROJ CDN outage silently demotes every transform to noop and the
      # build still succeeds. (-96, 29.5) moves 0.612 m on the audited stack —
      # GDAL 3.13.3 / GEOS 3.14.1 / PROJ 9.8.1, sf built from source — and
      # exactly 0 m under noop, so the floor is what discriminates and the
      # ceiling only catches nonsense.
      - name: Gate the R geospatial stack
        run: |
          Rscript -e 'v <- sf::sf_extSoftVersion()
            stopifnot(
              "GDAL predates the audited stack" =
                numeric_version(v[["GDAL"]]) >= "3.9",
              "no Parquet driver - this is the CRAN sf binary" =
                "Parquet" %in% rownames(sf::st_drivers()))
            d <- as.numeric(sf::st_distance(
              sf::st_transform(sf::st_sfc(sf::st_point(c(-96, 29.5)), crs = 4269), 4326),
              sf::st_sfc(sf::st_point(c(-96, 29.5)), crs = 4326)))
            cat(sprintf("GDAL %s / GEOS %s / PROJ %s; NAD83->WGS84 at (-96, 29.5) moves %.4f m (0.6121 audited)\n",
                        v[["GDAL"]], v[["GEOS"]], v[["PROJ"]], d))
            stopifnot(
              "NAD83->WGS84 is a noop - no datum grid reached this runner" = d > 0.1,
              "NAD83->WGS84 moved more than 5 m - wrong pipeline entirely" = d < 5)'

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # The transform is the thing everything else registers against, so it is
      # gated before anything is built, not after something is published.
      # check-registration is pure arithmetic against a frozen reference table,
      # so it is cheap and offline and runs every time.
      - name: Gate the transform
        run: Rscript tools/check-registration.R

      # check-constants re-downloads cb_2020_us_state_20m from Census to prove
      # the frozen AlbersUSA layout still matches upstream. That is a network
      # dependency worth having when the code changed and worth NOT having in a
      # weekly cron, where a Census outage would fail a run that touches none of
      # it. The constants cannot drift on their own; only an edit moves them.
      - name: Gate the frozen constants
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: Rscript tools/check-constants.R

      - name: Update archive
        env:
          # GitHub's macOS runners are small; usdm.R would otherwise ask for
          # detectCores() - 2. A weekly run builds one week, so this only
          # matters on a forced full rebuild.
          WORKERS: '3'
        run: |
          set -euo pipefail
          for s in $SCRIPTS; do
            for sp in $SPACES; do
              echo "::group::$s ($sp)"
              SPACE=$sp Rscript "$s"
              echo "::endgroup::"
            done
          done

      # One gate per space, because they read different names, a different index
      # and a different bounds box, and check-usdm.R takes one space per
      # invocation for the same reason usdm.R does.
      - name: Gate the published USDM
        if: contains(env.SCRIPTS, 'usdm.R') && contains(env.SPACES, 'dummy')
        env:
          SAMPLE: '6'
        run: Rscript tools/check-usdm.R

      - name: Gate the published USDM (geographic)
        if: contains(env.SCRIPTS, 'usdm.R') && contains(env.SPACES, 'geo')
        env:
          SPACE: geo
          SAMPLE: '6'
        run: Rscript tools/check-usdm.R
